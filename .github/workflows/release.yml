name: release

on:
  push:
    tags: ["guardrail-v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - slug: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # build + stage + sha256 in one step. The `command -v shasum` fallback
      # disappears rather than moving: it existed because macOS ships shasum and
      # Linux ships sha256sum, and the action computes the digest itself instead
      # of shelling out to whichever one the runner happens to have.
      - name: Build
        uses: pleme-io/actions/rust-cross-build@main
        with:
          binary-name: guardrail
          target: ${{ matrix.target }}
          suffix: ${{ matrix.slug }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-${{ matrix.slug }}
          # rust-cross-build stages into dist/. upload-artifact strips to the
          # common ancestor, so the artifact's contents are unchanged and the
          # publish job's `release/guardrail-*` glob still matches.
          path: dist/guardrail-${{ matrix.slug }}*
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/guardrail-*

  crates:
    needs: build
    uses: pleme-io/substrate/.github/workflows/crates-publish.yml@main
    secrets:
      CRATES_API_TOKEN: ${{ secrets.CRATES_API_TOKEN }}