# pleme-io doctrine rules — absolutes from the org CLAUDE.md that are
# expressible as a Bash-command pattern.
#
# SEVERITY, and why it is not uniform:
#
# The two `sed-inplace-*` rules are `block` by OPERATOR OVERRIDE (2026-07-27,
# "this sed stuff is just a no"). That outranks the shadow-first default — it is
# L0 on the precedence ladder — and the evidence already existed: a stream editor
# mutating a structured file reports success based on whether it RAN, never on
# whether what it wrote is valid, so its failure mode is indistinguishable from
# its success. A tool with that property cannot be used to verify anything, which
# is why /deshellify treats it as a hard no rather than a preference.
#
# The remaining three stay `warn`: shadow-first, the discipline breathe applies
# to its own actuators. `terraform apply` and `docker build` both have narrow
# legitimate uses here (the documented akeylesslabs Terragrunt estate;
# pre-bootstrap), so blocking them on day one would train the operator to bypass
# the gate — which costs more than the rule earns. Promote on evidence: once a
# rule has fired on real traffic and every firing was a true positive.
#
# EVERY RULE CARRIES A `test_allow` THAT IS PROSE DESCRIBING THE BANNED THING.
# A detector that matches the documentation OF its own rule is a real failure
# mode, not a hypothetical: a naive `grep format!` over egaku-term returned 5
# hits of which 4 were doc-comments stating there is no `format!()`. A rule
# that fires on "never use sed -i" trains the operator to bypass the gate.

# ── In-place file mutation by a stream editor ───────────────────────
# The org rule: never use a stream editor to mutate a file that stays. It
# cannot see the grammar, so it silently produces a file that still parses but
# means something else. Use a typed edit instead.
#
# BROADENED 2026-08-11 FROM A STRUCTURED-FILE EXTENSION LIST TO EVERY PATH, by
# operator instruction ("automatically /deshellify any sed ever anywhere you
# ever find"). Two rules used to require the path to end in
# `.nix|.ya?ml|.toml|.rs|.json`, which made the guard a function of the
# FILENAME rather than of the operation — and the operation is what is unsafe.
# The extension list missed, among others, `go.mod`, `Dockerfile`, `.envrc`,
# `Makefile`, a shell rc, and any path built from a variable (`$f`, `$out/x`),
# which is the shape a derivation phase actually writes. Receipt the same day:
# substrate's `goDirectiveNormalization` shipped a
# `sed -i -E 's|^go 1.N$|go 1.N.0|' go.mod` inside a Nix build phase — no
# extension in the list, so no rule could ever have fired, and the defect was
# the canonical one (a directive with a trailing comment does not match, sed
# exits 0, the phase reports success while normalizing nothing).
#
# The chained variant was folded in rather than kept: `(^|[;&|]\s*)` already
# anchors to the start of ANY segment, so the second rule was matching a strict
# subset of the first and only doubled the message.

- name: sed-inplace-any-file
  # THE FLAG MUST BE AN ARGUMENT — `\s-` is load-bearing, not tidiness.
  #
  # This alternation used to read `(-[a-zA-Z]*i[a-zA-Z]*\b|--in-place)` with no
  # constraint on what preceded the hyphen, so it matched ANY hyphenated token
  # containing an `i` anywhere in the rest of the command — including inside a
  # PATH. In this fleet that is not an edge case, it is most paths:
  # `pleme-io`, `pleme-lib`, `akeyless-images`, `blackmatter-nvim` all match.
  #
  # The result was a rule that blocked exactly what its own message promises is
  # unaffected. Measured 2026-08-11, twice in one session, both READ-ONLY:
  #   sed -n '287p' docs/pleme-io-CLAUDE.md          -> blocked on `-io`
  #   sed -n '278,312p' charts/pleme-lib/.../x.tpl   -> blocked on `-lib`
  # Neither mutates anything. A block that fires on inspection teaches agents
  # to route around the rule rather than obey it, which costs more than the
  # rule buys — and it cost this session two detours into other tooling.
  #
  # The fix is `([^;&|]*\s)?` — the flag must begin a TOKEN, either immediately
  # after the command or after whitespace. It cannot weaken the real block: an
  # in-place flag is always its own argv token, so `sed -i`, `sed --in-place`,
  # `perl -pi -e` and `awk -i inplace` all still match. What stops matching is a
  # hyphen INSIDE a word, which is never a flag.
  #
  # A first attempt at this fix used a bare `\s-` and BROKE THE BLOCK, because
  # `\s+` above already consumes the separator, so `\s-` demanded a second
  # space and `sed -i 's/x/y/' f` stopped matching. Caught by
  # `sed_rules_do_fire_on_the_real_thing` — which is the argument for a rule
  # carrying both a test_block and a test_allow: loosening a pattern to kill a
  # false positive is exactly the edit that silently disarms it.
  pattern: '(^|[;&|]\s*)(sed|perl|awk)\s+([^;&|]*\s)?(-[a-zA-Z]*i[a-zA-Z]*\b|--in-place)'
  severity: block
  message: "In-place stream edit — a stream editor reports success based on whether it RAN, never on whether its pattern matched or what it wrote is valid, so its failure mode is identical to its success. Use a typed edit (Edit/Write), or compute the file's bytes and install them. Read-only extraction (sed -n, awk '{print}') is unaffected."
  category: filesystem
  test_block: "sed -i 's/foo/bar/' flake.nix"
  test_allow: "sed -n '278,312p' charts/pleme-lib/templates/_jetstream_stream.tpl"

# ── Scratch interpreter as an editing tool ──────────────────────────
# The sibling shape of the rule above, and the one that survives it: blocked
# from `sed -i`, the reflex is a throwaway `python3 - <<'PY'` that opens the
# same file and rewrites it. Same properties — real logic, no review, no tests,
# gone before anyone reads it — and it defeats the rule above rather than
# obeying it.
#
# Receipt, 2026-08-11, in the session that broadened these rules: a
# `python3 - <<EOF` heredoc mutated mado's `src/browser_engine.rs` to migrate
# four call sites. It happened to be correct, and nothing would have said so if
# it had not been; the typed `Edit` for the same change fails loudly on a
# missed or ambiguous match, which is the property the heredoc gives up.
#
# `warn`, not block, and deliberately: a one-line `python3 -c` that READS
# (parses JSON, tallies a listing) is legitimate and frequent, so blocking the
# interpreter outright would train the operator to bypass the gate — the same
# reasoning this file applies to `terraform apply`. The pattern therefore
# requires either a heredoc body or a write-shaped call, not the bare `-c`.

- name: scratch-interpreter-file-mutation
  pattern: "(^|[;&|]\\s*)(python[0-9.]*|ruby|node)\\s+(-\\s*<<|-c\\b[^;]*\\b(open|write|File\\.|writeFileSync)\\b)"
  severity: warn
  message: "A scratch interpreter used as an editing tool — same shape as sed -i, one language further out: real logic with no review, no tests, and a silent no-op when its assumption is wrong. Use Edit/Write for a file that stays, or a /tmp/<name>.tlisp run through tatara-script for ad-hoc logic worth keeping."
  category: filesystem
  test_block: "python3 - <<'PY'"
  test_allow: "python3 -c 'import json,sys; print(json.load(sys.stdin)[\"rev\"])'"

# ── Hand-run infrastructure execution ───────────────────────────────
# PLATFORM-MEDIATED INFRASTRUCTURE: the operator (pangea-operator) is the sole
# executor. A human's only two verbs are DECLARE and OBSERVE. There is no
# "just apply it this once" — that is the path-of-least-resistance cardinal sin.
#
# `terraform destroy` / `apply -auto-approve` / `force-unlock` / `state rm` /
# `taint` are already covered in defaults.yaml. These close two gaps:
# the `tofu` binary (which is what this fleet actually invokes) is not matched
# at all, and a plain `apply` without -auto-approve is not matched either.

- name: tofu-hand-execution
  pattern: '(^|[;&|]\s*)tofu\s+(apply|destroy|import|state\s+rm|force-unlock|taint)\b'
  severity: warn
  message: "Hand-run tofu against infrastructure — pangea-operator is the sole executor. Declare the change in the InfrastructureTemplate spec and let the operator reconcile; do not route around the platform."
  category: terraform
  test_block: "tofu apply -var-file=prod.tfvars"
  test_allow: "tofu fmt -check"

- name: terraform-apply-by-hand
  pattern: '(^|[;&|]\s*)terraform\s+apply\b'
  severity: warn
  message: "Hand-run terraform apply — pangea-operator is the sole executor (the akeylesslabs/* Terragrunt estate is the documented exception). Declare and observe rather than applying directly."
  category: terraform
  test_block: "terraform apply"
  test_allow: "terraform plan -out=tfplan"

# ── Image building ──────────────────────────────────────────────────
# Pillar 8: Nix only, no Dockerfiles. Production images are dockerTools output,
# minimal/distroless by construction — a `docker build` bypasses the whole
# supply-chain provenance argument (the closure IS the SBOM).

- name: docker-build-not-nix
  pattern: '(^|[;&|]\s*)docker\s+build\b'
  severity: warn
  message: "docker build — Pillar 8 is Nix-only image building (dockerTools). A Dockerfile forfeits derivable provenance: with Nix the closure IS the SBOM and removing a dep means the code was never in the artifact."
  category: docker
  test_block: "docker build -t myimage ."
  test_allow: "docker images"

# ── Exit-code masking on long-running nix commands ──────────────────
# `nix … | tail -N` reports the PIPELINE's status, which is tail's, so a FAILED
# nix command reads as exit 0. It also buffers, so the log stays empty until the
# command ends — no progress on a multi-minute build.
#
# Measured 2026-08-02, twice in one session: `nix flake update 2>&1 | tail -60`
# aborted on a bad input and was reported as "exit code 0", and
# `nix run .#rebuild 2>&1 | tail -30` produced an empty log for the whole build.
# The nix repo's own maintenance-juggling doc already warns that "| tail hides
# progress"; this makes it catchable instead of re-learnable.
#
# `warn`, per this file's shadow-first default: it is a correctness-of-reporting
# problem, not a destructive one, and `nix search … | head` is legitimate.
# Promote to block once every firing has been a true positive.

- name: nix-piped-exit-code-masked
  pattern: '(^|[;&|]\s*)(nix|nixos-rebuild|darwin-rebuild)\s[^|]*\|\s*(tail|head)\b'
  severity: warn
  message: "Piping nix/rebuild through tail|head masks the exit code (you get tail's, always 0) and buffers all output so progress is invisible. Redirect and check explicitly: `nix flake update > /tmp/out.log 2>&1; echo exit=$?`."
  category: nix
  test_block: "nix flake update 2>&1 | tail -60"
  test_allow: "echo 'never pipe a nix command through tail — the exit code becomes tail(1)s'"

# ── Wait loops built on pgrep -f ────────────────────────────────────
# `until ! pgrep -f PATTERN; do …; done` hangs forever: `pgrep -f` matches full
# command lines INCLUDING the shell running the loop, whose own argv contains
# PATTERN. The condition is true because of the WAITER, so it never clears.
#
# Hit twice in one session (2026-08-02/03): once wedging a rebuild wait, once
# falsely reporting a rebuild in flight when `ps | grep` showed none.
#
# This rule was WITHDRAWN on 2026-08-02 because it could not fire:
# `PrefixPrefilter::is_safe` fast-rejects a command whose first 3 words per
# segment miss PREFIX_SET, and for `until ! pgrep …` those are until / ! / pgrep.
# Adding `pgrep` to that set (src/engine/prefilter.rs) is what makes it
# reachable, and the second occurrence is what justified the hot-path entry.

# ── Whole-tree staging with concurrent agents ───────────────────────
# `git add -A` / `git add .` / `git commit -a` stage EVERYTHING in the worktree,
# including files a DIFFERENT agent session staged seconds earlier. Multiple
# `claude --dangerously-skip-permissions` sessions routinely share one working
# directory, so this is not hypothetical.
#
# Measured 2026-08-02 in pleme-io/nix: eleven commits landed in ~28 hours with
# the subject `init`, several containing another session's in-progress files —
# one swept up a half-written module and pushed it. The commit-subject guard
# (blackmatter.components.gitconfig.hooks.rejectSubjects) fixes the meaningless
# MESSAGE; this addresses the actual mechanism, which is the whole-tree stage.
#
# `warn`, not block: `git add -A` is completely legitimate in a repo only you are
# touching, and blocking it outright would train the operator to bypass the gate.
# The remedy is `git add <path> …` — name what you changed, which is also what
# makes a commit reviewable.

- name: git-add-all-sweeps-concurrent-work
  pattern: '(^|[;&|]\s*)git\s+(add\s+(-A|--all|\.)|commit\s+(-[a-zA-Z]*a[a-zA-Z]*\b|--all))'
  severity: warn
  message: "Whole-tree staging (git add -A/./--all, git commit -a) sweeps in anything ANOTHER agent session staged in this shared worktree — measured: eleven `init` commits in one day, some carrying a second session's in-progress files. Stage explicit paths: `git add <path> …`."
  category: git
  test_block: "git add -A"
  test_allow: "echo 'git add -A can sweep another agents staged files in a shared worktree'"

- name: pgrep-f-self-matching-wait
  pattern: '(^|[;&|]\s*)(until|while)\s[^;]*pgrep\s+-f'
  severity: warn
  message: "A wait loop on `pgrep -f` matches the loop's OWN command line, so the condition never clears and it hangs forever. Match the process another way (`pgrep -x`, the parent `sudo` line, a pidfile), or build the pattern from parts so it is absent from your own argv."
  category: process
  test_block: "until ! pgrep -f 'darwin-rebuild switch'; do sleep 10; done"
  test_allow: "echo 'a pgrep -f wait loop can match its own command line and hang'"

# ── macOS preferences mutated outside nix-darwin ────────────────────
# macOS state is declared in pleme.darwin.* (nix-darwin system.defaults) and
# nowhere else. A hand-run `defaults write` works, persists, and is invisible
# to every other node, so the fleet drifts without any config diff to show it.
#
# Receipt, 2026-09-21: cid and ryn had identical declared trackpad config, yet
# ryn's four-finger Spaces swipe crossfaded and cid's slid. ryn carried an
# undeclared com.apple.universalaccess reduceMotion = 1 that no module wrote.
# Fixed by declaring it (pleme.darwin.shell.trackpad, pleme-io/nix 5b012573).
#
# `block` by OPERATOR OVERRIDE ("force ourselves to manage it declaratively"),
# the same L0 basis as the sed rules above. Reads (`defaults read`,
# `defaults domains`) are untouched; they are how drift gets found. The
# declarative path is the `declarative-macos` skill.
- name: macos-defaults-write-not-declared
  pattern: '(^|[;&|]\s*|["'']\s*)(sudo\s+(-u\s+\S+\s+)?)?(/usr/bin/)?defaults\s+(-currentHost\s+)?(write|delete|import|rename)\b'
  severity: block
  message: "Hand-mutating the macOS defaults DB — the change persists on this Mac only, with no config diff, and that is how cid and ryn drifted apart. Declare it instead: a typed pleme.darwin.* option (nix-darwin system.defaults.*; CustomUserPreferences only for keys nix-darwin doesn't model), then rebuild. `defaults read` is unaffected. See the declarative-macos skill."
  category: nix
  test_block: "defaults write com.apple.universalaccess reduceMotion -bool false"
  test_allow: "defaults read com.apple.universalaccess reduceMotion"
