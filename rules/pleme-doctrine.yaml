# pleme-io doctrine rules — absolutes from the org CLAUDE.md that are
# expressible as a Bash-command pattern.
#
# SEVERITY, and why it is not uniform:
#
# The two `sed-inplace-*` rules are `block` by OPERATOR OVERRIDE (2026-07-27,
# "this sed stuff is just a no"). That outranks the shadow-first default — it is
# L0 on the precedence ladder — and the evidence already existed: a stream editor
# mutating a structured file reports success based on whether it RAN, never on
# whether what it wrote is valid, so its failure mode is indistinguishable from
# its success. A tool with that property cannot be used to verify anything, which
# is why /deshellify treats it as a hard no rather than a preference.
#
# The remaining three stay `warn`: shadow-first, the discipline breathe applies
# to its own actuators. `terraform apply` and `docker build` both have narrow
# legitimate uses here (the documented akeylesslabs Terragrunt estate;
# pre-bootstrap), so blocking them on day one would train the operator to bypass
# the gate — which costs more than the rule earns. Promote on evidence: once a
# rule has fired on real traffic and every firing was a true positive.
#
# EVERY RULE CARRIES A `test_allow` THAT IS PROSE DESCRIBING THE BANNED THING.
# A detector that matches the documentation OF its own rule is a real failure
# mode, not a hypothetical: a naive `grep format!` over egaku-term returned 5
# hits of which 4 were doc-comments stating there is no `format!()`. A rule
# that fires on "never use sed -i" trains the operator to bypass the gate.

# ── Structured-file mutation ────────────────────────────────────────
# The org rule: never use a stream editor to mutate a structured file (Nix,
# YAML, TOML, Rust, JSON). It cannot see the grammar, so it silently produces
# a file that still parses but means something else. Use a typed edit instead.

- name: sed-inplace-structured-file
  pattern: '(^|[;&|]\s*)(sed|perl)\s+(-[a-zA-Z]*i[a-zA-Z]*|--in-place)\b[^;&|]*\.(nix|ya?ml|toml|rs|json)\b'
  severity: block
  message: "In-place stream edit of a structured file — sed/perl cannot see the grammar and can leave a file that still parses but means something else. Use a typed edit (Edit/Write, or the language's own AST tooling)."
  category: filesystem
  test_block: "sed -i 's/foo/bar/' flake.nix"
  test_allow: "echo 'the rule is: never use sed -i on a .nix file'"

- name: sed-inplace-structured-file-chained
  pattern: '[;&|]\s*(sed|perl)\s+(-[a-zA-Z]*i[a-zA-Z]*|--in-place)\b[^;&|]*\.(nix|ya?ml|toml|rs|json)\b'
  severity: block
  message: "In-place stream edit of a structured file, chained after another command — same grammar-blindness risk. Use a typed edit."
  category: filesystem
  test_block: "cd repo && sed -i.bak 's/a/b/' Cargo.toml"
  test_allow: "cd repo && cat Cargo.toml"

# ── Hand-run infrastructure execution ───────────────────────────────
# PLATFORM-MEDIATED INFRASTRUCTURE: the operator (pangea-operator) is the sole
# executor. A human's only two verbs are DECLARE and OBSERVE. There is no
# "just apply it this once" — that is the path-of-least-resistance cardinal sin.
#
# `terraform destroy` / `apply -auto-approve` / `force-unlock` / `state rm` /
# `taint` are already covered in defaults.yaml. These close two gaps:
# the `tofu` binary (which is what this fleet actually invokes) is not matched
# at all, and a plain `apply` without -auto-approve is not matched either.

- name: tofu-hand-execution
  pattern: '(^|[;&|]\s*)tofu\s+(apply|destroy|import|state\s+rm|force-unlock|taint)\b'
  severity: warn
  message: "Hand-run tofu against infrastructure — pangea-operator is the sole executor. Declare the change in the InfrastructureTemplate spec and let the operator reconcile; do not route around the platform."
  category: terraform
  test_block: "tofu apply -var-file=prod.tfvars"
  test_allow: "tofu fmt -check"

- name: terraform-apply-by-hand
  pattern: '(^|[;&|]\s*)terraform\s+apply\b'
  severity: warn
  message: "Hand-run terraform apply — pangea-operator is the sole executor (the akeylesslabs/* Terragrunt estate is the documented exception). Declare and observe rather than applying directly."
  category: terraform
  test_block: "terraform apply"
  test_allow: "terraform plan -out=tfplan"

# ── Image building ──────────────────────────────────────────────────
# Pillar 8: Nix only, no Dockerfiles. Production images are dockerTools output,
# minimal/distroless by construction — a `docker build` bypasses the whole
# supply-chain provenance argument (the closure IS the SBOM).

- name: docker-build-not-nix
  pattern: '(^|[;&|]\s*)docker\s+build\b'
  severity: warn
  message: "docker build — Pillar 8 is Nix-only image building (dockerTools). A Dockerfile forfeits derivable provenance: with Nix the closure IS the SBOM and removing a dep means the code was never in the artifact."
  category: docker
  test_block: "docker build -t myimage ."
  test_allow: "docker images"

# ── Exit-code masking on long-running nix commands ──────────────────
# `nix … | tail -N` reports the PIPELINE's status, which is tail's, so a FAILED
# nix command reads as exit 0. It also buffers, so the log stays empty until the
# command ends — no progress on a multi-minute build.
#
# Measured 2026-08-02, twice in one session: `nix flake update 2>&1 | tail -60`
# aborted on a bad input and was reported as "exit code 0", and
# `nix run .#rebuild 2>&1 | tail -30` produced an empty log for the whole build.
# The nix repo's own maintenance-juggling doc already warns that "| tail hides
# progress"; this makes it catchable instead of re-learnable.
#
# `warn`, per this file's shadow-first default: it is a correctness-of-reporting
# problem, not a destructive one, and `nix search … | head` is legitimate.
# Promote to block once every firing has been a true positive.

- name: nix-piped-exit-code-masked
  pattern: '(^|[;&|]\s*)(nix|nixos-rebuild|darwin-rebuild)\s[^|]*\|\s*(tail|head)\b'
  severity: warn
  message: "Piping nix/rebuild through tail|head masks the exit code (you get tail's, always 0) and buffers all output so progress is invisible. Redirect and check explicitly: `nix flake update > /tmp/out.log 2>&1; echo exit=$?`."
  category: nix
  test_block: "nix flake update 2>&1 | tail -60"
  test_allow: "echo 'never pipe a nix command through tail — the exit code becomes tail(1)s'"

# ── Wait loops built on pgrep -f — NOT A RULE, and here is why ──────
# `until ! pgrep -f PATTERN; do …; done` hangs forever: `pgrep -f` matches full
# command lines INCLUDING the shell running the loop, whose own argv contains
# PATTERN. Measured 2026-08-02 against a real rebuild wait.
#
# It is NOT expressible as a rule here today. `PrefixPrefilter::is_safe` scans
# the first 3 words of each `;&|` segment against PREFIX_SET; for
# `until ! pgrep …` those are until / ! / pgrep, and `pgrep` is not in the set,
# so the command is fast-rejected and NEVER REACHES the regex — in production
# exactly as in the test harness, which flagged it via
# `all_suite_rules_engine_valid` (the wrapped-in-echo failure).
#
# Adding a rule anyway would have shipped a guard that can never fire while
# reading like a working one — the precise failure this file's header warns
# about. Making it real means adding `pgrep` to PREFIX_SET in
# src/engine/prefilter.rs, i.e. paying a hot-path entry for a non-destructive
# productivity footgun. Not obviously worth it; recorded so the next person
# inherits the finding instead of re-deriving it.
